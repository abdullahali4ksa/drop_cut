<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Chrome Scissor Blades -->
    <linearGradient id="leftBladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="rightBladeGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Handle Gradients -->
    <linearGradient id="leftHandleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="rightHandleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Pivot Face Gradient (Friendly Golden Mascot) -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Squircle Card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.7" filter="url(#shadow)" />

  <!-- Background Dashed Snip Trail -->
  <path d="M 70 120 Q 256 70 442 120" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="10,12" stroke-opacity="0.4" />

  <!-- Scissor Handles (Bottom Loops) -->
  <!-- Left Handle (Electric Blue/Cyan) -->
  <circle cx="150" cy="375" r="58" fill="none" stroke="url(#leftHandleGrad)" stroke-width="28" />
  <circle cx="150" cy="375" r="38" fill="none" stroke="#0B132B" stroke-width="4" stroke-opacity="0.3" />

  <!-- Right Handle (Creative Orange) -->
  <circle cx="362" cy="375" r="58" fill="none" stroke="url(#rightHandleGrad)" stroke-width="28" />
  <circle cx="362" cy="375" r="38" fill="none" stroke="#0B132B" stroke-width="4" stroke-opacity="0.3" />

  <!-- Left Scissor Blade (Crosses from Right Handle to Top Left) -->
  <path d="M 334 330 L 256 240 L 126 84 C 138 72 152 70 160 76 L 274 232 Z" fill="url(#leftBladeGrad)" stroke="#BAE6FD" stroke-width="2" />

  <!-- Right Scissor Blade (Crosses from Left Handle to Top Right) -->
  <path d="M 178 330 L 256 240 L 386 84 C 374 72 360 70 352 76 L 238 232 Z" fill="url(#rightBladeGrad)" stroke="#7DD3FC" stroke-width="2" />

  <!-- Blade Bevel Highlight Lines -->
  <line x1="256" y1="240" x2="126" y2="84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="240" x2="386" y2="84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Center Pivot: Laughing Scissor Mascot Face! -->
  <circle cx="256" cy="256" r="68" fill="url(#faceGrad)" stroke="#F59E0B" stroke-width="6" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="62" fill="none" stroke="#FEF9C3" stroke-width="3" stroke-opacity="0.8" />

  <!-- Laughing Eyes (^ ^) -->
  <!-- Left Eye -->
  <path d="M 220 242 Q 232 222 244 242" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
  <!-- Right Eye -->
  <path d="M 268 242 Q 280 222 292 242" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />

  <!-- Rosy Cheeks -->
  <ellipse cx="214" cy="262" rx="10" ry="7" fill="#FB7185" fill-opacity="0.65" />
  <ellipse cx="298" cy="262" rx="10" ry="7" fill="#FB7185" fill-opacity="0.65" />

  <!-- Cheerful Laughing Open Mouth -->
  <path d="M 234 256 Q 256 298 278 256 Z" fill="#1E293B" />
  <!-- Cute Pink Tongue -->
  <path d="M 242 276 Q 256 298 270 276 Z" fill="#F43F5E" />
  <!-- Shiny Tooth Highlight -->
  <path d="M 242 258 Q 256 264 270 258 Z" fill="#FFFFFF" />

  <!-- Joyful Sparkles (Snip Stars) -->
  <!-- Top Left Sparkle -->
  <path d="M 106 74 Q 106 88 120 88 Q 106 88 106 102 Q 106 88 92 88 Q 106 88 106 74 Z" fill="#FDE047" />
  <!-- Top Right Sparkle -->
  <path d="M 406 74 Q 406 88 420 88 Q 406 88 406 102 Q 406 88 392 88 Q 406 88 406 74 Z" fill="#38BDF8" />
  <!-- Small Center Star -->
  <circle cx="256" cy="136" r="6" fill="#FFFFFF" />
</svg>